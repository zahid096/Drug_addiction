<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drug Addiction Risk Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>🧠 Drug Addiction Predictor</h1>
            <p>Complete the form below to assess the risk of drug addiction</p>
        </div>

        <div class="form-card">
            <form id="predictionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="age">Age </label>
                        <input type="number" id="age" name="age" required min="18" max="100" placeholder="Enter age" />
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender </label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            {% for option in field_options.gender %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="family_history_of_addiction">Family History of Addiction (Anyone in family had
                            addiction before)</label>
                        <select id="family_history_of_addiction" name="family_history_of_addiction" required>
                            <option value="">Select option</option>
                            {% for option in field_options.family_history_of_addiction %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mental_health_issues">Mental Health Issues (Any mental problem like stress or
                            depression)</label>
                        <select id="mental_health_issues" name="mental_health_issues" required>
                            <option value="">Select option</option>
                            {% for option in field_options.mental_health_issues %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="past_drug_use">Past Drug Use (Used drugs before)</label>
                        <select id="past_drug_use" name="past_drug_use" required>
                            <option value="">Select option</option>
                            {% for option in field_options.past_drug_use %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="peer_pressure">Peer Pressure (Friends force or influence them)</label>
                        <select id="peer_pressure" name="peer_pressure" required>
                            <option value="">Select option</option>
                            {% for option in field_options.peer_pressure %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="stress_or_trauma">Stress or Trauma (Had stress or sad life events)</label>
                        <select id="stress_or_trauma" name="stress_or_trauma" required>
                            <option value="">Select option</option>
                            {% for option in field_options.stress_or_trauma %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="social_isolation">Social Isolation (Feeling isolated or disconnected from
                            others)</label>
                        <select id="social_isolation" name="social_isolation" required>
                            <option value="">Select option</option>
                            {% for option in field_options.social_isolation %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="how_often_they_use_drugs">How Often They Use Drugs (Frequency of drug use)</label>
                        <select id="how_often_they_use_drugs" name="how_often_they_use_drugs" required>
                            <option value="">Select option</option>
                            {% for option in field_options.how_often_they_use_drugs %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="work_or_school_problems">Work or School (Performance)</label>
                        <select id="work_or_school_problems" name="work_or_school_problems" required>
                            <option value="">Select option</option>
                            {% for option in field_options.work_or_school_problems %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="health_problems">Health Problems (Any health issue)</label>
                        <select id="health_problems" name="health_problems" required>
                            <option value="">Select option</option>
                            {% for option in field_options.health_problems %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="access_to_drugs">Access to Drugs (Easy to get drugs)</label>
                        <select id="access_to_drugs" name="access_to_drugs" required>
                            <option value="">Select option</option>
                            {% for option in field_options.access_to_drugs %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="why_they_use_drugs">Why They Use Drugs (Reasons for drug use)</label>
                        <select id="why_they_use_drugs" name="why_they_use_drugs" required>
                            <option value="">Select option</option>
                            {% for option in field_options.why_they_use_drugs %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="trying_to_quit">Trying to Quit (Trying to stop drugs)</label>
                        <select id="trying_to_quit" name="trying_to_quit" required>
                            <option value="">Select option</option>
                            {% for option in field_options.trying_to_quit %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-predict" id="predictBtn">
                    🔮 Predict Addiction
                </button>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-title">Prediction Result</div>
            <div class="result-value" id="resultValue">-</div>
            <div class="confidence" id="confidence"></div>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
