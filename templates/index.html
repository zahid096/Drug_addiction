<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Drug Addiction Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="header">
        <h1>🧠 Drug Addiction Predictor</h1>
        <p>Complete the form below to assess the risk of drug addiction</p>
    </div>

    <div class="card">
        <form id="predictionForm">
            <div class="grid">

                <div class="field">
                    <label>Age *</label>
                    <input type="number" name="age" required>
                </div>

                {% for field, options in field_options.items() %}
                <div class="field">
                    <label>{{ field.replace('_',' ').title() }} *</label>
                    <select name="{{ field }}" required>
                        <option value="">Select</option>
                        {% for op in options %}
                        <option value="{{ op }}">{{ op }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endfor %}

            </div>

            <button type="submit" class="predict-btn">🔮 Predict Addiction Risk</button>
        </form>
    </div>

    <div id="resultCard" class="result-card" style="display:none;">
        <h2>Prediction Result</h2>
        <div id="result"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
